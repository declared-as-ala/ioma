version: "3.8"

# Deployed on a SHARED VPS already running many other unrelated client
# projects behind an existing Nginx Proxy Manager instance (ports 80/443
# are already owned by that container — never bind them here). Web/API are
# published directly on dedicated host ports instead until a real domain
# is pointed at this project and a proxy host is added in NPM for it. See
# DEPLOYMENT.md.
#
# Env var names here MUST match apps/api/src/config/env.validation.ts
# exactly — a previous draft of this file used names (MONGODB_URI,
# JWT_SECRET, REDIS_HOST/REDIS_PORT) that don't exist in that schema and
# would have crash-looped the container on boot (the schema fails loudly
# on unrecognized/missing required vars, by design — see SECURITY.md).
# Real values are supplied via the `.env.prod` file on the host, never
# committed — see `env_file` below.

services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ioma-prod-web
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_HOST_PORT:-3200}:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: ioma-prod-api
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/ioma
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
    ports:
      - "${API_HOST_PORT:-4200}:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: ioma-prod-mongo
    restart: always
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ioma-prod-redis
    restart: always
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ioma-prod-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-prod-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-prod-data:
  redis-prod-data:
  minio-prod-data:
